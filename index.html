  <body>
    <!-- Schermata d'avvio: si vede subito (prima del codice, 1,3 MB), segue le fasi vere del caricamento
         (codice, terreno, vie, foto 3D) e si dissolve sulla mappa già disegnata sotto. API: window.__avvio -->
    <div id="avvio" role="status" aria-live="polite">
      <svg class="av-paese" viewBox="0 0 240 120" aria-hidden="true">
        <path class="av-monte av-m1" d="M0 96 L38 52 L58 70 L92 22 L120 58 L146 38 L182 74 L208 54 L240 84 L240 120 L0 120 Z"/>
        <path class="av-monte av-m2" d="M0 104 L30 82 L62 94 L96 66 L128 88 L160 72 L196 94 L240 90 L240 120 L0 120 Z"/>
        <path class="av-mare" d="M0 104 Q60 96 120 104 T240 104 L240 120 L0 120 Z"/>
        <path class="av-via" d="M18 100 C48 92 60 84 84 86 S118 74 132 80 S170 90 196 82"/>
      </svg>
      <div class="av-nome">Positano 3D</div>
      <div class="av-barra"><div class="av-pieno"></div></div>
      <div class="av-fase" id="avvio-testo">Carico la mappa…</div>
      <div class="av-consiglio" id="avvio-consiglio"></div>
    </div>
    <style>
      #avvio { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        padding: 24px; background: #0e4f7d; color: #fff; font: 500 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;
        transition: opacity .7s ease, visibility .7s; }
      /* mentre si dissolve non deve intercettare le dita: sotto la mappa è già viva (prima il primo pizzico andava a vuoto) */
      #avvio.via { opacity: 0; visibility: hidden; pointer-events: none; }
      .av-paese { width: min(72vw, 300px); height: auto; overflow: visible; }
      .av-monte { fill: #f2d9b4; transform-origin: 50% 100%; animation: av-sale 1.2s cubic-bezier(.2,.8,.2,1) both; }
      .av-m1 { opacity: .55; } .av-m2 { animation-delay: .15s; }
      .av-mare { fill: #38b6ff; animation: av-onda 3.6s ease-in-out infinite alternate; }
      .av-via { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 260; stroke-dashoffset: 260; animation: av-traccia 2.4s .6s ease-in-out forwards; }
      .av-nome { font-size: 26px; font-weight: 800; letter-spacing: -.01em; animation: av-appare .8s .3s both; }
      .av-barra { width: min(60vw, 220px); height: 4px; border-radius: 2px; background: rgba(255,255,255,.2); overflow: hidden; }
      .av-pieno { height: 100%; width: 0; background: #fff; border-radius: 2px; }
      .av-fase { opacity: .9; min-height: 1.4em; }
      .av-consiglio { max-width: 300px; font-size: 14px; opacity: 0; min-height: 2.8em; transition: opacity .5s; color: #d6ecff; }
      .av-consiglio.su { opacity: 1; }
      @keyframes av-sale { from { transform: scaleY(.2); opacity: 0 } }
      @keyframes av-onda { to { transform: translateX(-6px) } }
      @keyframes av-traccia { to { stroke-dashoffset: 0 } }
      @keyframes av-appare { from { opacity: 0; transform: translateY(6px) } }
      @media (prefers-reduced-motion: reduce) { #avvio * { animation: none !important; } .av-via { stroke-dashoffset: 0; } }
    </style>
    <script>
      (function () {
        var q = location.search, en = /lang=en/.test(q) || (!/lang=it/.test(q) && !(navigator.language || 'it').toLowerCase().startsWith('it'))
        var T = en
          ? { codice: 'Loading the map…', terreno: 'Shaping the hills…', vie: 'Drawing streets and steps…', foto: 'Loading the 3D photos…', pronto: 'Here we are' }
          : { codice: 'Carico la mappa…', terreno: 'Modello le colline…', vie: 'Traccio vie e scale…', foto: 'Scarico le foto 3D…', pronto: 'Eccoci' }
        var C = en
          ? ['Tap a place, then “Take me here”: the route starts from where you are.', 'Walking times count the steps: Positano has many.', 'The house button saves where you are staying.', 'Lost? The arrows button resets the view.', 'Share a route on WhatsApp with one tap.']
          : ['Tocca un punto e poi «Portami qui»: il percorso parte da dove sei.', 'I tempi a piedi contano le scale: a Positano sono tante.', 'Il pulsante con la casetta salva dove alloggi.', 'Ti sei perso? Il pulsante con le frecce rimette la vista.', 'Condividi un percorso su WhatsApp con un tocco.']
        var el = document.getElementById('avvio'), pieno = el.querySelector('.av-pieno'), testo = document.getElementById('avvio-testo'), cons = document.getElementById('avvio-consiglio')
        testo.textContent = T.codice
        // la barra segue un obiettivo e ci arriva morbida; non torna mai indietro. Durante il codice (che non dà avanzamento)
        // l'obiettivo sale da solo verso il 35% e rallenta, come un'attesa vera
        var t0 = performance.now(), base = 0, tetto = 35, mostrato = 0, obiettivo = 0, finito = false, max3d = 0
        function giro(t) {
          if (base === 0) obiettivo = Math.max(obiettivo, tetto * (1 - Math.exp(-(t - t0) / 5000)))
          mostrato += (obiettivo - mostrato) * 0.06
          pieno.style.width = mostrato.toFixed(1) + '%'
          if (!finito || mostrato < 99.5) requestAnimationFrame(giro)
        }
        requestAnimationFrame(giro)
        var i = 0
        function consiglio() { cons.classList.remove('su'); setTimeout(function () { cons.textContent = C[i++ % C.length]; cons.classList.add('su') }, 500) }
        var ti = setTimeout(function () { consiglio(); ti = setInterval(consiglio, 4500) }, 1800)
        var FASI = { terreno: 45, vie: 62, foto: 75 }
        window.__avvio = {
          fase: function (k) { if (finito || !FASI[k]) return; base = FASI[k]; obiettivo = Math.max(obiettivo, base); testo.textContent = T[k] },
          // foto 3D: quante tessere di Google mancano; la barra va da 75 a 97 man mano che calano
          tessere: function (n) { if (finito || base < 75) return; max3d = Math.max(max3d, n); if (max3d) obiettivo = Math.max(obiettivo, 75 + 22 * (1 - n / max3d)) },
          fine: function () {
            if (finito) return; finito = true; obiettivo = 100; testo.textContent = T.pronto; clearTimeout(ti); clearInterval(ti)
            setTimeout(function () { el.classList.add('via'); setTimeout(function () { el.remove() }, 800) }, 450)
          },
        }
      })()
    </script>
